<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Details - Smart-Agro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#123524">
    <link rel="stylesheet" href="/css.css">
</head>
<body>
    <div class="bg-animation"></div>

    <nav id="navbar">
        <h2 class="logo">Smart-Agro <span>Animal Details</span></h2>
    </nav>

    <div class="container">
        <div id="message" class="section glass-effect text-center">Loading...</div>

        <div id="detail" class="hidden">
            <div class="section glass-effect">
                <h2 id="animalTitle"></h2>
                <div class="cards">
                    <div class="card"><h3>Status</h3><p id="cStatus" class="stat-text"></p></div>
                    <div class="card"><h3>Age</h3><p id="cAge" class="stat-text"></p></div>
                    <div class="card"><h3>Next vaccine</h3><p id="cVaccine" class="stat-text"></p></div>
                </div>
            </div>

            <div class="section glass-effect">
                <h2>Profile and Vaccination</h2>
                <table class="data-table"><tbody id="profileBody"></tbody></table>
            </div>

            <div class="section glass-effect">
                <h2>Milk Records</h2>
                <p id="milkSummary"></p>
                <table class="data-table">
                    <thead><tr id="milkHead"></tr></thead>
                    <tbody id="milkBody"></tbody>
                </table>
            </div>

            <div id="financeBox" class="section glass-effect hidden">
                <h2>Money Details</h2>
                <table class="data-table"><tbody id="financeBody"></tbody></table>
            </div>
            <p id="financeNote" class="hint"></p>
        </div>
    </div>

    <footer id="appFooter"><p>Developed by Nur Hossain Rhedoy</p></footer>

    <script>
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const money = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
        const dayStart = s => new Date(s + 'T00:00:00');

        function age(birth) {
            const b = dayStart(birth), n = new Date();
            let m = (n.getFullYear() - b.getFullYear()) * 12 + n.getMonth() - b.getMonth();
            if (n.getDate() < b.getDate()) m--;
            if (isNaN(m) || m < 0) return '-';
            const y = Math.floor(m / 12), mm = m % 12;
            return (y ? y + (y > 1 ? ' years ' : ' year ') : '') + mm + (mm === 1 ? ' month' : ' months');
        }

        function vaccine(next) {
            if (!next) return { text: '-', cls: '' };
            const now = new Date(); now.setHours(0, 0, 0, 0);
            const days = Math.round((dayStart(next) - now) / 86400000);
            if (days < 0) return { text: `Overdue by ${-days} day${days === -1 ? '' : 's'}`, cls: 'loss-text' };
            if (days <= 7) return { text: days === 0 ? 'Due today' : `Due in ${days} day${days === 1 ? '' : 's'}`, cls: 'neutral-text' };
            return { text: 'Up to date', cls: 'profit-text' };
        }

        const row = (label, value, cls = '') => `<tr><td class="label">${label}</td><td class="${cls}">${value}</td></tr>`;

        (async function () {
            const key = location.pathname.split('/').pop();
            const token = localStorage.getItem('token');
            try {
                const res = await fetch('/api/public/animal/' + encodeURIComponent(key), { headers: token ? { Authorization: 'Bearer ' + token } : {} });
                const a = await res.json();
                if (!res.ok) { $('message').textContent = a.message || 'Could not load this animal.'; return; }

                const v = vaccine(a.nextVaccine);
                $('animalTitle').textContent = a.id;
                $('cStatus').textContent = a.status === 'sold' ? 'Sold' : 'Active';
                $('cAge').textContent = age(a.birthDate);
                $('cVaccine').textContent = v.text;
                $('cVaccine').className = 'stat-text ' + v.cls;

                $('profileBody').innerHTML =
                    row('Animal ID', esc(a.id)) +
                    row('Status', a.status === 'sold' ? 'Sold on ' + esc(a.soldDate || '-') : 'Active') +
                    row('Birth date', esc(a.birthDate)) +
                    row('Age', esc(age(a.birthDate))) +
                    row('Last vaccination', esc(a.lastVaccine || '-')) +
                    row('Next vaccination', esc(a.nextVaccine || '-')) +
                    row('Vaccine status', esc(v.text), v.cls);

                $('milkSummary').textContent = `${a.daysRecorded} day(s) recorded, ${money(a.totalMilk)} liters in total.`;
                const owner = a.isOwner;
                $('milkHead').innerHTML = '<th>Date</th><th>Milk (L)</th>' + (owner ? '<th>Price/L</th><th>Expense</th><th>Profit</th>' : '');
                $('milkBody').innerHTML = a.logs.map(l => `<tr><td>${esc(l.date)}</td><td>${money(l.milk)}</td>` +
                    (owner ? `<td>${money(l.price)}</td><td>${money(l.expense)}</td><td class="${l.profit > 0 ? 'profit-text' : l.profit < 0 ? 'loss-text' : 'neutral-text'}">${money(l.profit)}</td>` : '') + '</tr>').join('')
                    || `<tr><td colspan="${owner ? 5 : 2}">No milk records yet.</td></tr>`;

                if (owner && a.finance) {
                    const f = a.finance, c = n => (n > 0 ? 'profit-text' : n < 0 ? 'loss-text' : 'neutral-text');
                    $('financeBody').innerHTML =
                        row('Buying price', money(f.buyPrice) + ' BDT') +
                        row('Total milk income', money(f.totalIncome) + ' BDT') +
                        row('Total expenses', money(f.totalExpense) + ' BDT') +
                        row('Operating profit (milk)', money(f.opProfit) + ' BDT', c(f.opProfit)) +
                        (f.finalProfit === null
                            ? row('Profit after buying price so far', money(f.netSoFar) + ' BDT', c(f.netSoFar))
                            : row('Selling price', money(f.sellPrice) + ' BDT') + row('Final life profit', money(f.finalProfit) + ' BDT', c(f.finalProfit)));
                    $('financeBox').classList.remove('hidden');
                } else {
                    $('financeNote').textContent = 'Money details are shown only when the farm owner is logged in on this phone.';
                }

                $('message').classList.add('hidden');
                $('detail').classList.remove('hidden');
            } catch (e) {
                $('message').textContent = 'Could not connect to the server.';
            }
        })();
    </script>
</body>
</html>
